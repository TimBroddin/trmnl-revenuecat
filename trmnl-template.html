<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      padding: 20px;
      background: #000;
      color: #000;
    }

    .container {
      display: flex;
      gap: 20px;
      height: 100%;
    }

    .projects-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .projects-header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid #000;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .project-item {
      padding: 10px;
      border: 1px solid #000;
      background: #fff;
    }

    .project-name {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .project-metrics {
      display: flex;
      gap: 15px;
      font-size: 12px;
    }

    .project-metric {
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      opacity: 0.6;
      font-size: 10px;
    }

    .metric-value {
      font-weight: bold;
      font-size: 13px;
    }

    .totals-section {
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .total-box {
      background: #000;
      color: #fff;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100px;
    }

    .total-label {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .total-value {
      font-size: 28px;
      font-weight: bold;
    }

    .header {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">RevenueCat Metrics</div>

  <div class="container">
    <!-- Projects List (Left) -->
    <div class="projects-section">
      <div class="projects-header">Projects</div>
      <div class="project-list">
        {{#each projects}}
          <div class="project-item">
            <div class="project-name">{{ this.name }}</div>
            <div class="project-metrics">
              <div class="project-metric">
                <span class="metric-label">MRR</span>
                <span class="metric-value">{{ this.mrr }}</span>
              </div>
              <div class="project-metric">
                <span class="metric-label">Revenue (28d)</span>
                <span class="metric-value">{{ this.revenue }}</span>
              </div>
            </div>
          </div>
        {{/each}}
      </div>
    </div>

    <!-- Totals (Right) -->
    <div class="totals-section">
      <div class="total-box">
        <div class="total-label">Total MRR</div>
        <div class="total-value">{{ total_mrr }}</div>
      </div>

      <div class="total-box">
        <div class="total-label">28-Day Revenue</div>
        <div class="total-value">{{ total_revenue }}</div>
      </div>
    </div>
  </div>
</body>
</html>
