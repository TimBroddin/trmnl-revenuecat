<div class="screen">
  <!-- Header with totals -->
  <div class="layout layout--row gap--lg mb--lg">
    <!-- Total MRR -->
    <div class="layout layout--col layout--center stretch-x">
      <span class="label">Total MRR</span>
      <span class="value value--xxlarge value--tnums">{{ total_mrr }}</span>
    </div>

    <!-- Total Revenue -->
    <div class="layout layout--col layout--center stretch-x">
      <span class="label">28-Day Revenue</span>
      <span class="value value--xxlarge value--tnums">{{ total_revenue }}</span>
    </div>
  </div>

  <!-- Projects table -->
  <table class="table">
    <thead>
      <tr>
        <th><span class="title title--small">Project</span></th>
        <th class="align--right"><span class="title title--small">MRR</span></th>
        <th class="align--right"><span class="title title--small">Revenue (28d)</span></th>
      </tr>
    </thead>
    <tbody>
      {{#each projects}}
        <tr>
          <td><span class="label">{{ this.name }}</span></td>
          <td class="align--right"><span class="value value--small value--tnums">{{ this.mrr }}</span></td>
          <td class="align--right"><span class="value value--small value--tnums">{{ this.revenue }}</span></td>
        </tr>
      {{/each}}
    </tbody>
  </table>
</div>
