<div class="layout layout--col gap">
  <!-- Two metric boxes - smaller if > 5 projects -->
  {% if projects.size <= 5 %}
    <div class="grid grid--cols-2 gap">
      {% render "metric_box_compact", label: "MRR", value: total_mrr %}
      {% render "metric_box_compact", label: "Revenue", value: total_revenue %}
    </div>
  {% endif %}

  <!-- Full projects table -->
  {% render "project_table_full" projects: projects %}
</div>

<!-- Title bar -->
{% render "title_bar" %}
